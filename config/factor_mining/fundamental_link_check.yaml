# fundamental_link_check —— 起步三因子链路验证批次（阶段8 基本面方向）。
#
# 这**不是战役**：不挂 prereg 门、不做因子裁决，唯一目的是验证
# 「面板化 → GP → 边际贡献」链路与防线（openspec
# add-fundamental-gp-panel-bridge 的链路验证 + 性能实测任务），并给出
# 全窗墙钟读数。GP 参数因此取小；结果数字不进任何裁决台账。
#
# 点火（操作人；CPU 任务，非 GPU）：
#     python -m scripts.research.fundamental_gp_campaign mine \
#         --config config/factor_mining/fundamental_link_check.yaml
# 裸 CLI（python -m src.factor_mining.miner）会因缺注入工厂而拒跑——
# 这是缝的契约，不是缺陷。
#
# 短窗铁律：end_date 止于 2022-12-31（IS 内）。2025 holdout 与 2023+
# 段绝不进本配置——tests/logic/factor_mining/test_fundamental_link_check_preset.py
# 钉住这条边界。

run_id: null                # 每次点火自动生成唯一 run_id
output_dir: output/factor_mining/fundamental_link_check
pool_top_k: 20

data:
  mode: pit
  pit_provider_uri: "${QUANT_PROVIDER_URI:-D:/qlib_data/my_cn_data_pit}"
  delisted_registry_path: "${QUANT_DELISTED_REGISTRY:-D:/qlib_data/tushare_raw/delisted_registry.parquet}"
  universe_name: csi800
  start_date: "2021-01-01"
  end_date: "2022-12-31"
  forward_horizon: 1
  forward_return_price: close
  # pv 侧留空 = 既有 V1 十二终端（链路验证无冻结义务；战役自会收窄）。
  fields: []
  # --- 基本面腿（四元组；工厂经 campaign 脚本注入）---
  fundamental_store_root: "${QUANT_FIN_STORE:-D:/qlib_data/financial_pit_raw}"
  fundamental_calendar_path: "${QUANT_FIN_CALENDAR:-D:/qlib_data/my_cn_data_pit/calendars/day.txt}"
  # 起步三因子输入并集（冻结出处 docs/prereg/quality_profitability.yaml）：
  #   C1_GPA = revenue, oper_cost, total_assets
  #   资产增长 = total_assets（+prior，工厂恒带 __prior 代）
  #   C3_cash_based_OP = + sell_exp, admin_exp, accounts_receiv, inventories,
  #                        prepayment, accounts_pay, adv_receipts, contract_liab
  fundamental_fields:
    - revenue
    - oper_cost
    - sell_exp
    - admin_exp
    - total_assets
    - accounts_receiv
    - inventories
    - prepayment
    - accounts_pay
    - adv_receipts
    - contract_liab
  # 金融排除集：120 只，操作人 2026-08-17 签收（导出脚本
  # scripts/research/export_financial_exclusions.py，规则 =
  # financial_issuers_from_industry 稳定行业名单，快照 20260817）。
  # 签收即冻结——不随快照漂移；view 的 oper_cost cross-check 运行时
