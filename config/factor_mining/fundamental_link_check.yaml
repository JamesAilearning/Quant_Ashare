gp:
  # 链路验证规模：足以育出并求值跨端点/含 prior 的表达式，不足以
  # 构成任何有统计意义的搜索——这正是意图。
  population_size: 40
  n_generations: 3
  tournament_size: 3
  elite_frac: 0.05
  p_crossover: 0.7
  p_mutate_subtree: 0.15
  p_mutate_point: 0.10
  p_mutate_const: 0.05
  max_depth: 4
  min_depth: 2
  seed: 20260817

