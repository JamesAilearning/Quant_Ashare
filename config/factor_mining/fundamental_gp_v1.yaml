# 基本面 GP 挖掘战役 · 搜索批次配置（阶段8 基本面方向）
#
# 本文件的每个语义字段都由 docs/prereg/fundamental_gp_v1.yaml 冻结，且由
# tests/governance/test_fundamental_gp_freeze.py 逐条比对——改这里而不改
# 冻结件（或反之）会让治理测试红。
#
# 点火（操作人；CPU 任务，非 GPU）——**必须**经 campaign 脚本，裸 CLI
# （python -m src.factor_mining.miner）会因缺注入工厂而拒跑：
#     python -m scripts.research.fundamental_gp_campaign mine \
#         --config config/factor_mining/fundamental_gp_v1.yaml
#
# 窗口铁律：end_date 止于 IS 尾 2022-12-31。OOS（2023-01-01
# 起）、holdout（2025）、forbidden（2026-01-01 起）
# 绝不进本配置——GP 唯一可见窗就是 IS。

# 与冻结协议的**绑定**：campaign 脚本的 mine 子命令见到它就加载
# docs/prereg/fundamental_gp_v1.yaml 并逐字段校验（窗口 / 宇宙 / 排除集 /
# 终端 / 算子 / fitness 与 search 的穷尽冻结 / pool_top_k），任一偏离即
# 拒。没有它，--config 指向哪份文件是自由的 —— 治理钉只能保证仓库里这
# 份 preset 与协议一致，保证不了这次 run 用的就是它。
protocol_id: fundamental_gp_v1

run_id: null
output_dir: output/factor_mining/fundamental_gp_v1
pool_top_k: 200

data:
  mode: pit
  pit_provider_uri: "${QUANT_PROVIDER_URI:-D:/qlib_data/my_cn_data_pit}"
  delisted_registry_path: "${QUANT_DELISTED_REGISTRY:-D:/qlib_data/tushare_raw/delisted_registry.parquet}"
  universe_name: csi800
  start_date: "2019-01-01"
  end_date: "2022-12-31"
  forward_horizon: 1
  forward_return_price: close
  # 量价侧留空 = 既有 V1 十二终端照常进面板（forward return 与覆盖率
  # 分母需要它们），但它们**不进 GP 采样白名单**（见 gp.allowed_terminals）：
  # 本役协议冻结的搜索空间只含财报终端。面板成分与搜索空间是两件事，
  # 由两个字段分别表达 —— 正因为白名单不再从面板键推导，这份 preset
  # 才能如实描述实验（治理钉 test_the_search_space_carries_no_price_volume_terminal
  # 断言白名单与 V1 量价终端零交集）。
  fields: []
  # --- 基本面腿（四元组）---
  fundamental_store_root: "${QUANT_FIN_STORE:-D:/qlib_data/financial_pit_raw}"
  fundamental_calendar_path: "${QUANT_FIN_CALENDAR:-D:/qlib_data/my_cn_data_pit/calendars/day.txt}"
  # 17 个 charter 字段（int_exp 按实测覆盖 0.03 明令排除）；工厂恒带
  # __prior 期代 → 面板 34 个财报终端。
  fundamental_fields:
    - revenue
    - total_revenue
    - oper_cost
    - sell_exp
    - admin_exp
    - rd_exp
    - fin_exp
    - total_assets
    - total_hldr_eqy_inc_min_int
    - total_hldr_eqy_exc_min_int
    - accounts_receiv
    - inventories
    - prepayment
    - accounts_pay
    - adv_receipts
    - contract_liab
    - n_cashflow_act
  # 金融排除集：120 只，操作人 2026-08-17 签收（快照 20260817）。
  # 签收即冻结；与 fundamental_link_check.yaml 同一份名单，摘要由治理
  # 测试双向钉死。
