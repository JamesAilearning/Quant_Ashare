gp:
  # 终端白名单 = 17 charter 字段 x 2 期代 = 34（int_exp 按实测覆盖
  # 0.03 明令排除）。量价终端在面板里但不在此列 —— 协议冻结的搜索
  # 空间是财报侧。
  allowed_terminals:
    - $revenue
    - $revenue__prior
    - $total_revenue
    - $total_revenue__prior
    - $oper_cost
    - $oper_cost__prior
    - $sell_exp
    - $sell_exp__prior
    - $admin_exp
    - $admin_exp__prior
    - $rd_exp
    - $rd_exp__prior
    - $fin_exp
    - $fin_exp__prior
    - $total_assets
    - $total_assets__prior
    - $total_hldr_eqy_inc_min_int
    - $total_hldr_eqy_inc_min_int__prior
    - $total_hldr_eqy_exc_min_int
    - $total_hldr_eqy_exc_min_int__prior
    - $accounts_receiv
    - $accounts_receiv__prior
    - $inventories
    - $inventories__prior
    - $prepayment
    - $prepayment__prior
    - $accounts_pay
    - $accounts_pay__prior
    - $adv_receipts
    - $adv_receipts__prior
    - $contract_liab
    - $contract_liab__prior
    - $n_cashflow_act
    - $n_cashflow_act__prior
  # 战役规模（与 pv_incremental_v1 同量级）。链路验证批次用的 40x3 只
  # 验链路，不构成搜索。
  population_size: 500
  n_generations: 50
  tournament_size: 3
  elite_frac: 0.05
  p_crossover: 0.7
  p_mutate_subtree: 0.15
  p_mutate_point: 0.10
  p_mutate_const: 0.05
  max_depth: 6
  min_depth: 2
  seed: 20260818
  # 完整算子白名单 = 基线 28 + coalesce（OpenSpec 修订入册，#441）。
  # 缺省（空）= 基线 28：注册表增长不会拓宽任何未显式声明的搜索。
  allowed_operators:
    - abs
    - add
    - cs_demean
    - cs_rank
    - cs_winsorize
    - cs_zscore
    - div_safe
    - log_safe
    - mul
    - neg
    - sign
    - sqrt_safe
    - sub
    - ts_argmax
    - ts_argmin
    - ts_corr
    - ts_decay_linear
    - ts_delta
    - ts_kurt
    - ts_max
    - ts_mean
    - ts_min
    - ts_pctchange
    - ts_rank
    - ts_skew
    - ts_std
    - ts_sum
    - where
    - coalesce

fitness:
  w_ic: 1.0
  w_ir: 0.5
  w_rankic: 0.5
  w_turnover: 0.2
  w_corr: 0.8
  w_complexity: 0.01
  coverage_min: 0.8
  # 正交惩罚本役关闭（增量性由晋升门配对回答，不在育种期优化）。
  w_orthogonality: 0.0
