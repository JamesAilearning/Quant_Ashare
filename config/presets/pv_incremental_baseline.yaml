# pv_incremental_v1 基线预测生成 run（阶段8 战役二 PV-DP-3）。
#
# 用途：为 GP 正交惩罚与 OOS 增量判据提供 Alpha158+LGB 生产同源基线
# 预测。与 csi800_campaign_base.yaml 严格同形（同宇宙、同基准、同双
# guard、同滑点），唯一差异 = overall_end 与 output_dir。
#
# **圣规防线**：`overall_end: "2024-12-31"`。父配置 config_walk.yaml
# 缺省 2025-12-31，会训练进入并预测 2025 holdout 年——冻结协议
# （docs/prereg/pv_incremental.yaml `fitness.baseline.overall_end`）
# 钉死此尾。折按季对齐，IS/OOS 分界 2023-01-01 恰落折边界。
#
# ensemble_window 继承父配置的 3（冻结件 `fitness.baseline.
# ensemble_window`）——折预测是生产同源 warm-ensemble，不是单模型
# 输出：「对生产基线增量」须对着生产实际使用的信号测。
#
# Run discipline: 一次不间断调用（resume 混提交会让 report 的
# git_commit 解析为 null，provenance 门直接拒）：
#     python scripts/run_walk_forward.py config/presets/pv_incremental_baseline.yaml
# 随后 python scripts/research/pv_incremental_baseline_export.py 导出
# 宽表 + provenance sidecar，成对登记入 docs/prereg/pv_incremental_ledger.yaml。
extends: ../../config_walk.yaml

instruments: "csi800"
benchmark_code: "SH000906TR"
attribution_sleeve_grouping: true
risk_constraints_enabled: true
risk_constraints_calibration: "campaign_v1"
# 违规反应（本档独有）。本次跑的产物是**样本外预测**——战役的唯一增量判据
# (正交惩罚) 只吃 baseline_preds.parquet，组合构建与收益率与判据无关。而
# 预测在回测之前产生、且两种 mode 下逐字节相同（2026-08-07 实测:fold 02 在
# 回测抛异常的情况下仍写出 46,812 行完好预测）。
#
# 用 raise 的代价是:一个被动漂移到 5.01%(上限 5.00%)的持仓,会废掉整整一个
# 季度的预测覆盖。首跑 19 folds 有 3 个因此判死(fold 02/05/10,超限幅度
# 0.01~1.55 个百分点)。那些空洞随后会被口径①(penalize_covered_days_only)
# 静默吸收——正是本役一路在防的静默降级。
#
# 这不是让官方指标绕过上限的通道:clip 后的配置产生的收益率不是 RAISE 校验
# 过的那一套,故 tests/governance/test_risk_constraints_mode_optin.py 钉死了
# 允许声明本键的 tracked preset 集合(仅本档)。
risk_constraints_mode: "warn_and_clip"
# 并须独立声明本跑的产物是什么（codex #406 r2）。刻意不从 mode 派生：派生等于
# 把守卫的钥匙交给被守卫的那个开关——选了宽松 mode 就自动获得豁免，正是边界
# 检查要堵的那条未 tracked 入口。声明也随报告落盘。
metrics_purpose: "predictions_only"
slippage_bps: 5.0
# IS 全覆盖（2026-08-08）。父配置的 2018-01-01 起点会被 24m train + 3m valid
# 吃掉,首个样本外预测落在 2020-04-01——即冻结 IS 窗(2018-01-01 起)只有
# 670/1215 天被基线覆盖,GP 的正交惩罚在其余 45% 的 IS 日上无约束力。退到
# 2015-10-01 后首个 test 窗恰为 2018-01-01,与 IS 窗起点严丝合缝。
#
# 该值取决于**数据边界**而非偏好:原 bundle 起于 2018-01-02,当时 55% 就是上
# 限。tushare 回补 2015-10-01..2017-12-31(52,866 单元,零 hole,独立审计含实
# 调 API 逐值比对)后,bundle 日历 2082 -> 2631 天,新增 549 天恰等于该区间的
# 交易日数。跑本档需 QUANT_PROVIDER_URI 指向含 2015 数据的 bundle;指向旧
# bundle 会得到更少的折,而不是静默的错误覆盖。
#
# 冻结协议(docs/prereg/pv_incremental.yaml `fitness.baseline`)钉的是 model /
# ensemble_window / overall_end,**未**钉 overall_start,故本项不违反冻结;但
# 它改变基线定义,须记入战役台账。
overall_start: "2015-10-01"
overall_end: "2024-12-31"
output_dir: "output/walk_forward/pv_incremental_baseline"
