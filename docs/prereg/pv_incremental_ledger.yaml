      PR #412 合并即签署）：基线 overall_start 由父配置的 2018-01-01 前移至
      2015-10-01，使首个样本外 test 窗恰落在冻结 IS 起点（2018-01-01），
      IS 基线覆盖由 670/1215 天（55%）升至 1215/1215 天（100%）。原决策①
      "折几何保生产同源、IS 前段无覆盖不罚且如实披露"的机制不变
      （penalize_covered_days_only 保留），其"首个样本外日晚于 IS 起点"的
      前提自本修订起为历史陈述。train 窗保持 24m；OOS 折分毫不动；
      overall_end=2024-12-31 圣规不变。数据前提：tushare 回补
      2015-10-01..2017-12-31（52,866 单元、零 hole、独立审计六道含实调 API
      逐值比对），新 bundle my_cn_data_pit_2015（生产 bundle 未触碰）。
      随行守卫（同 PR）：训练覆盖 fail-loud 链——交易所日历落盘
