      ① 两臂均显式 adjust_mode=post_adjusted——treatment 的因子经
      PITDataProvider 求值，该 provider 把 canonical 运行时钉在
      post_adjusted；若只改 treatment，两臂会多出第二处差异而配对
      失效，故基线臂同步声明。绝对数字因此与生产 pre_adjusted 口径
      不可直接比，本步判据是两臂之差。② 晋升 bundle 由 runner 既有
      bind 站点注册（mined_factor_* 键经环境变量注入，未设则
      fail-loud），--expect-verdict-sha256 由可选改为必需（output/
      不入 git，可选的绑定不是绑定）。
      结果另行登记为 E009。
