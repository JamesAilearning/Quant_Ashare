      两臂配对 walk-forward：baseline=Alpha158，treatment=
      Alpha158PlusMined（Alpha158 全特征 + 该因子列，qlib
      NestedDataLoader join=left 保基线行集，label 与处理器取自
      Alpha158 本身）；两 preset 逐键差异仅 feature_handler 与
      output_dir（治理钉锁死）。
      **判定窗独占 OOS dev**：overall_start 2020-10-01 + 24m train +
      3m valid ⇒ 首个 test 窗恰为 2023-01-01，8 个季度折全落
      2023-2024。GP 见过 IS 窗（2018-2022），故判定几何直接不生成
      IS test 折（非事后剔除）。train 窗保持 24m 生产同源。
      **canonical 口径**：两臂均不设 risk_constraints_mode /
      metrics_purpose（默认 raise/official）——净基差判据需 RAISE
      校验过的真实净收益，E004 的 predictions_only 口径不可充当
      对照臂。RAISE 折失败风险预告：任一臂折失败会收窄裁尺配对
      重叠，重叠不足时裁尺拒出 verdict（fail-loud 呈操作人），
      不得放宽门槛续跑；失败折数照录 E009。
      **判据 = 裁尺三态 verdict 原样**（--prereg-plan 决策级路径，
      paired moving-block-bootstrap CI on daily net excess），不另设
      第二判据或数字门槛：TREATMENT_BETTER → 进操作人签字步（含是否
      单向揭盲终裁）；INCONCLUSIVE/BASELINE_BETTER → 照录不晋升。
      2025 holdout 保持盲态。点火在操作人；两臂各一次不间断调用、
      干净树；本条目入 main 先于点火（台账先行，E002 教训）。
