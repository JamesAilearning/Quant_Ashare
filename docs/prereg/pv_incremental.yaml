# pv_incremental_v1 冻结预注册计划（PV-DP-1..8 签署件的机器可读形态）
# 签署 = #398 merge（2026-08-05）；本文件 merge 后不可修改——任何偏离
# 走新提案。评估器/FWER/裁决器在启动时加载并校验本文件，字段缺失或
# 值漂移一律 fail-loud。
protocol_id: pv_incremental_v1
signed_at_pr: 398

universe:
  instruments: csi800            # PIT membership spans 含退市
  ex_financials: false           # 与 Gate-4A 的刻意差异（PV-DP-1 明示）

fields:                          # 表达式输入恰七字段（PV-DP-1）
  - open
  - high
  - low
  - close
  - volume
  - money
  - turnover_rate

operators:                       # 恰 28，逐字=grammar.REGISTRY（PV-DP-4）
  - abs
  - add
  - cs_demean
  - cs_rank
  - cs_winsorize
  - cs_zscore
  - div_safe
  - log_safe
  - mul
  - neg
  - sign
  - sqrt_safe
  - sub
  - ts_argmax
  - ts_argmin
  - ts_corr
  - ts_decay_linear
  - ts_delta
  - ts_kurt
  - ts_max
  - ts_min
  - ts_mean
  - ts_pctchange
  - ts_rank
  - ts_skew
  - ts_std
  - ts_sum
  - where
ts_cov_excluded: true            # 基线明令排除（复权尺度污染）

gp:
  max_depth: 6                   # = gp_engine 设计常数（治理测试 cross-pin）
  min_depth: 2

windows:                         # PV-DP-2
  is_start: "2018-01-01"         # GP 唯一可见窗
  is_end: "2022-12-31"
  oos_start: "2023-01-01"        # 幸存者一次性评估
  oos_end: "2024-12-31"
  holdout_year: 2025             # 盲态；单向揭盲仅限晋升终裁
  forbidden_from: "2026-01-01"   # 与生产重叠段，挖掘全程禁用

metric:                          # PV-DP-3（Gate-4A 同源 lag 语义的日频形态）
  kind: daily_cross_sectional_rank_ic
  signal_to_execution_lag: 1     # t 信号 -> t+1 执行
  forward_return: close_exec_to_close_next   # close[t+1] -> close[t+2]
  min_names_per_day: 300         # 截面窄于此的交易日 drop+count
  aggregate: [ic_mean, ic_ir]

fitness:                         # GP 适应度 = ic_mean − 罚项（PV-DP-3）
  parsimony_lambda_per_node: 0.002
  orientation_recorded: true     # 实现 PR 冻结(codex #401 r13):|rank-IC|
                                 # 是符号盲的,而 OOS 单侧门槛检验带符号
                                 # IC——GP 必须记录 IS 符号(PoolEntry.
                                 # orientation ±1),候选注册表逐项携带,
                                 # 评估器在任何度量前应用;缺此则稳定负向
                                 # 因子被反向检验(系统性假阴性)
  ic_term: abs_rank_ic           # 实现 PR 冻结(操作人签,决策③):GP 繁殖
                                 # 信号用 |日截面 rank-IC 均值|——方向
                                 # 自由度属表达式本身(符号翻转是同一
                                 # 因子);FWER 单侧正门槛在 OOS 侧淘汰
                                 # 负向候选,注册时按 IS 符号规范化方向
  orthogonality:                 # 对 Alpha158 基线预测的日截面 Spearman
    fitness_band_abs_rho: 0.30   # 超带部分线性罚
    fitness_penalty_weight: 2.0
    oos_hard_band_mean_abs_rho: 0.50   # OOS 通过的必要条件（增量判据）
    min_coverage_of_ic_days: 0.95      # 基线须覆盖 ≥95% 的合格 IC 日,
                                       # 否则评估 run fail-loud(部分重叠
                                       # 不得静默判定增量性)
                                       # ——此门只管 OOS 决策评估
    is_coverage_policy: penalize_covered_days_only
                                 # 实现 PR 冻结(操作人签,决策①):基线
                                 # 保持生产 walk-forward 折几何,首个
                                 # 样本外日晚于 IS 窗起点,故 IS 前段
                                 # 无基线可比。正交罚只在有基线覆盖的
                                 # 日子计算;无重叠表达式不罚,但覆盖
                                 # 计数入 run 记录如实披露(不缩短 train
                                 # 窗造"更早基线"——那不是生产模型族)
  baseline:                      # 基线预测生成 run 的绑定义务
    model: alpha158_lgb_csi800_walkforward
    overall_start: "2015-10-01"  # 决策①-rev1(2026-08-08,change
                                 # 2026-08-08-pv-baseline-full-is-
                                 # coverage,操作人重签):数据边界解除
                                 # (tushare 回补+新 bundle)后基线起点
                                 # 前移 27 个月(step 整数倍,折网格对
                                 # 齐,OOS 折分毫不动),首个 test 窗恰
                                 # 为 IS 起点,正交罚获全 IS 覆盖。
                                 # train 窗仍 24m——原禁令"不缩短
                                 # train 窗造更早基线"继续有效。
    provenance_required: true    # run_config_sha256/source_git 全绿入 ledger
    ensemble_window: 3           # 实现 PR 冻结(操作人签,决策②):折预测
                                 # 取生产同源 warm-ensemble(config_walk
                                 # 缺省 3),非单模型输出——"对生产基线
                                 # 增量"须对着生产实际使用的信号测
    overall_end: "2024-12-31"    # 基线生成 run 的硬尾:config_walk 缺省
                                 # 2025-12-31 会训进并预测 holdout 年,
                                 # preset 必须钉死此值(圣规防线)

fwer:                            # PV-DP-5
  family: all_oos_evaluated_candidates
  method: full_batch_block_bootstrap_max_statistic
  statistic: one_sided_max_t     # Gate-4A 同源:带符号 t 的单侧 max,
                                 # 非 |t|——晋升判据是 t>=双门槛的单侧
                                 # 事件,|t| 会让负向波动抬高正向门槛
  n_boot: 10000
  block_len_days: 21
  quantile: 0.95
  hard_floor_t: 2.85
  per_trial_min_n_days: 120      # n 低于此的 trial 出族单报不参与裁决
  tri_state:
    clean_negative: reject_iff   # 全族观测 t < 双门槛且无幸存者
    survivors: promote_gate      # 幸存者进 PV-DP-7 晋升门
    significant_non_incremental: operator_decision
                                 # 有族员过双门槛但败于正交硬带——
                                 # 信号存在但非增量:不晋升也不构成
                                 # 方向关门,升级操作人裁决
    sparse_only: no_verdict      # 仅稀疏 trial 有信号不构成裁决

slices:                          # PV-DP-6：注册时冻结几何+probe 前置
  registered: []                 # 切片随批次注册，注册项含 stamp 几何与 probe 结果

promotion:                       # PV-DP-7（scope 边界）
  path: [fwer_survivor, phase6_handler, walkforward_paired_vs_baseline,
         net_basis_improvement, operator_signature, separate_production_proposal]
  production_wiring_in_scope: false

holdout_unblinded: false         # 单向标志；翻转仅限晋升终裁签字
